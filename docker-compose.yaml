services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - orbnet
    # volumes:
    #   - mongodb_data:/data/db

  mysql_db:
    image: mysql:8.0.33
    container_name: mysql
    ports:
      - "3308:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 1m30s
      timeout: 30s
      retries: 10
      start_period: 30s
#    volumes:
#        - mysql-data:/var/lib/mysql
    networks:
      - orbnet


  # [Begin OF Orbs]
  cli:
    container_name: cli
    image: ubuntu
    restart: on-failure
    command: /orb/cli.sh
    volumes:
      - ./orb/.build/extract/orb-cli-linux-amd64:/usr/local/sbin/orb-cli
      - ./orb/samples/tutorial:/orb
    networks:
      - orbnet

  orb-domain1:
    container_name: orb1.local
    image: ghcr.io/trustbloc/orb:latest
    restart: always
    environment:
      - ORB_HOST_URL=0.0.0.0:80
      - ORB_EXTERNAL_ENDPOINT=http://orb1.local
      - DID_NAMESPACE=did:orb
      - ALLOWED_ORIGINS=http://orb1.local
      - CAS_TYPE=local
      - ANCHOR_CREDENTIAL_SIGNATURE_SUITE=Ed25519Signature2018
      - DATABASE_TYPE=mem
      - ORB_KMS_TYPE=local
      - KMSSECRETS_DATABASE_TYPE=mem
      - DEV_MODE_ENABLED=true
      - INCLUDE_PUBLISHED_OPERATIONS_IN_METADATA=true
      - INCLUDE_UNPUBLISHED_OPERATIONS_IN_METADATA=true
      - UNPUBLISHED_OPERATION_STORE_ENABLED=true
      - DID_DISCOVERY_ENABLED=true
      - BATCH_WRITER_TIMEOUT=1000
      - VCT_ENABLED=true
      - LOG_LEVEL=info
    ports:
      - 48326:80
    command: start
    networks:
      - orbnet

  orb-domain2:
    container_name: orb2.local
    image: ghcr.io/trustbloc/orb:latest
    restart: always
    environment:
      - ORB_HOST_URL=0.0.0.0:80
      - ORB_EXTERNAL_ENDPOINT=http://orb2.local
      - DID_NAMESPACE=did:orb
      - ALLOWED_ORIGINS=http://orb2.local
      - CAS_TYPE=local
      - ANCHOR_CREDENTIAL_SIGNATURE_SUITE=Ed25519Signature2018
      - DATABASE_TYPE=mem
      - ORB_KMS_TYPE=local
      - KMSSECRETS_DATABASE_TYPE=mem
      - DEV_MODE_ENABLED=true
      - INCLUDE_PUBLISHED_OPERATIONS_IN_METADATA=true
      - INCLUDE_UNPUBLISHED_OPERATIONS_IN_METADATA=true
      - UNPUBLISHED_OPERATION_STORE_ENABLED=true
      - DID_DISCOVERY_ENABLED=true
      - BATCH_WRITER_TIMEOUT=1000
      - VCT_ENABLED=true
      - LOG_LEVEL=info
    ports:
      - 48426:80
    command: start
    networks:
      - orbnet

  # [End OF Orbs]

  keycloak:
    image: keycloak/keycloak:26.1.3
    container_name: pkt-keycloak
    restart: unless-stopped
    ports:
      - "7080:7080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      # KEYCLOAK_IMPORT: /tmp/realm.json
      KC_HOSTNAME: localhost
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_PORT: 7080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
      # KC_PROXY_ADDRESS_FORWARDING: "true"
      DB_VENDOR: ${DB_VENDOR}
      DB_ADDR: mysql_db
      DB_PORT: 3308
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${KEYCLOAK_DATABASE}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/auth/health/ready" ]
      interval: 15s
      timeout: 2s
      retries: 15
    command: [ "start-dev", "--http-port", "7080" ]
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - orbnet

  openbao:
    image: ghcr.io/openbao/openbao:latest
    container_name: openbao
    restart: unless-stopped
#    command: ["bao", "server", "-dev", "-dev-root-token-id", "$OPENBAO_DEV_ROOT_TOKEN_ID"]
    environment:
      # Root token for dev mode (do not use in production!)
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN_ID}
#      BAO_DEV_LISTEN_ADDRESS: http://0.0.0.0:${OPENBAO_DEV_LISTEN_PORT}
      DEV_DATABASE: mongodb
      DEV_MONGODB_URL: mongodb://admin:password@mongodb:27017
      DEV_MONGODB_DATABASE: openbao
      BAO_LOG_LEVEL: debug
      OIDC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      OIDC_DISCOVERY_URL: http://keycloak:7080/auth/realms/${KEYCLOAK_REALM_ID}
    cap_add:
      - IPC_LOCK
    ports:
      - ${OPENBAO_DEV_LISTEN_PORT}:${OPENBAO_DEV_LISTEN_PORT}
#    volumes:
#      - ./data/openbao:/openbao/file
    networks:
      - orbnet

networks:
  orbnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.28.0.0/24"
          gateway: "172.28.0.1"
